<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{$site_info.site_name|default=''}</title>
    <meta name="keywords" content="{$site_info.site_name|default=''}">
    <meta name="description" content="{$site_info.site_name|default=''}">
    <include file="public@head"/>
    <link href="__TMPL__/public/assets/css/service.css" rel="stylesheet" type="text/css">
</head>
<body>

<include file="public@nav"/>

<include file="public@banner"/>

<div class="content">

    <div class="content">
        <div class="title">GLOBAL SERVICE</div>

        <div class="service-desc">{$service_site.internationalization}</div>

        <div class="service-img">
            <img src="{:cmf_get_image_url($service_site.internationalization_image)}">
        </div>

        <ul class="service-area">
            <foreach name="service_site.areas" item="vo">
                <li class="service-area-item" style="background-color: {$vo.color}">
                    <div class="service-area-title">{$vo.area}</div>
                    <div class="service-area-line"></div>
                    <div class="service-area-country">({$vo.country} Country)</div>
                </li>
            </foreach>
        </ul>

        <div class="service-intro">
            <div class="service-intro-item">
                <div class="service-intro-title">{$service_site.left_title}</div>
                <div class="service-intro-desc">{$service_site.left_desc}</div>
            </div>
            <div class="service-intro-item">
                <div class="service-intro-title">{$service_site.left_title}</div>
                <div class="service-intro-desc">{$service_site.left_desc}</div>
            </div>
        </div>

        <div class="service-partner">
            <div class="title">Companies that have established cooperation</div>
            <ul class="service-partner-list">
                <foreach name="service_site.companies" item="vo">
                    <li class="service-partner-item">
                        <img src="{:cmf_get_image_url($vo.url)}" alt="{$vo.name}">
                    </li>
                </foreach>
            </ul>
        </div>

    </div>

</div>

<include file="public@foot"/>

</body>
</html>
